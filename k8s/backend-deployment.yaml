apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: prince765/todo-backend-devops:latest
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          envFrom:
            - secretRef:
                name: todo-backend-secret
