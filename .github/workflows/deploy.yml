name: Build, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: prince765/todo-backend-devops:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: prince765/todo-frontend-devops:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::794194376609:role/GitHubActions-EKS-INT378
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name todo-cluster

      - name: Restart backend
        run: |
          kubectl -n todo-app rollout restart deployment/todo-backend

      - name: Restart frontend
        run: |
          kubectl -n todo-app rollout restart deployment/todo-frontend

      - name: Wait for backend rollout
        run: |
          kubectl -n todo-app rollout status deployment/todo-backend --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl -n todo-app rollout status deployment/todo-frontend --timeout=180s
